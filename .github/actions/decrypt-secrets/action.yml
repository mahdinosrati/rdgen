name: 'Decrypt and Mask Secrets'
description: 'Decrypts a zip and masks the JSON contents as env vars'
inputs:
  config_ref:
    description: 'Temporary branch containing an encrypted configuration'
    required: false
    default: ''
  private_key:
    description: 'Private decryption key from the repository Actions secret'
    required: false
    default: ''
  config_json:
    description: 'Saved config for a standalone build (no Django server)'
    required: false
    default: ''
  zip_password:
    description: 'Password for the Zip'
    required: true
  zip_path:
    description: 'Path to the encrypted zip'
    required: false
    default: 'secrets.zip'

runs:
  using: "composite"
  steps:
    - name: Validate encrypted input branch
      if: inputs.config_ref != ''
      shell: python
      env:
        CONFIG_REF: ${{ inputs.config_ref }}
      run: |
        import os, re
        if not re.fullmatch(r'rdgen-inputs/[0-9a-f-]{36}', os.environ['CONFIG_REF']):
            raise ValueError('Invalid encrypted input branch')
    # Download data without registering a checkout post-job hook. The build
    # later replaces this workspace with the upstream RustDesk checkout.
    - name: Download encrypted configuration
      if: inputs.config_ref != ''
      shell: python
      env:
        CONFIG_REF: ${{ inputs.config_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        import os, pathlib, urllib.parse, urllib.request
        ref = urllib.parse.quote(os.environ['CONFIG_REF'], safe='')
        url = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
               + '/contents/.rdgen-inputs/payload.json?ref=' + ref)
        request = urllib.request.Request(url, headers={
            'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
            'Accept': 'application/vnd.github.raw+json',
            'X-GitHub-Api-Version': '2022-11-28',
        })
        target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rdgen-encrypted-payload.json'
        with urllib.request.urlopen(request, timeout=120) as response:
            target.write_bytes(response.read())
    - name: Decrypt uploaded configuration
      if: inputs.config_ref != ''
      shell: bash
      env:
        RDGEN_PRIVATE_KEY: ${{ inputs.private_key }}
      run: |
        python -m pip install cryptography
        python .github/scripts/decrypt_payload.py
    - name: Preserve build helpers
      shell: python
      run: |
        import os, pathlib, shutil
        target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rdgen-tools'
        shutil.copytree('.github/scripts', target, dirs_exist_ok=True)
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
            f.write('NETWORK_PATCH=' + str(target / 'patch_network.py') + '\n')
            f.write('PACKAGE_VERIFIER=' + str(target / 'verify_windows_package.py') + '\n')
    - name: Load standalone configuration
      if: inputs.config_json != '' && inputs.config_ref == ''
      shell: bash
      env:
        RDGEN_CONFIG: ${{ inputs.config_json }}
      run: python .github/scripts/serverless_config.py
    - name: install python deps
      if: inputs.config_json == '' && inputs.config_ref == ''
      shell: bash
      run: |
        pip install pyzipper
    - name: Decrypt and Mask
      if: inputs.config_json == '' && inputs.config_ref == ''
      shell: python
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: "utf-8"
      run: |
        import sys
        import io
        import pyzipper
        import json
        import os

        # Force UTF-8 stdout/stderr so secrets with characters outside
        # the runner codepage (CJK, emoji, etc.) do not crash this step
        # on Windows runners (default cp1251) with UnicodeEncodeError
        sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding="utf-8", errors="replace")
        sys.stderr = io.TextIOWrapper(sys.stderr.buffer, encoding="utf-8", errors="replace")

        with pyzipper.AESZipFile('${{ inputs.zip_path }}') as zf:
            zf.setpassword('${{ inputs.zip_password }}'.encode())
            with zf.open('secrets.json') as f:
                secrets = json.load(f)

        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
            for key, value in secrets.items():
                if value:
                    print(f"::add-mask::{value}")
                    env_file.write(f"{key}={value}\n")
        
        print(f"Successfully masked {len(secrets)} secrets.")
