name: Discover and qualify RustDesk releases
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry previously failed release candidates
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qualify-rustdesk-release
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_updated: ${{ steps.release.outputs.release_updated }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        env:
          RETRY_FAILED: ${{ inputs.retry_failed }}
        with:
          script: |
            const fs = require('fs');
            const {selectRelease} = require('./.github/scripts/release_selection.cjs');
            const stable = JSON.parse(fs.readFileSync('rdgenerator/supported_versions.json', 'utf8')).stable;
            const attempts = fs.existsSync('rdgenerator/release_attempts.json') ? JSON.parse(fs.readFileSync('rdgenerator/release_attempts.json', 'utf8')) : {};
            const releases = await github.paginate(github.rest.repos.listReleases, {owner: 'rustdesk', repo: 'rustdesk', per_page: 100});
            const candidate = selectRelease(releases, stable, attempts, process.env.RETRY_FAILED === 'true');
            if (!candidate) { core.notice('No untested stable RustDesk release found.'); return; }
            core.setOutput('version', candidate.tag_name);
            core.setOutput('release_updated', candidate.updated_at);
  build:
    needs: discover
    if: needs.discover.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/generator-windows.yml
    with:
      version: ${{ needs.discover.outputs.version }}
      config_json: '{"exename":"release-validation","serverIP":"validation.invalid","serverPort":"30116","key":"abc123=","relayServer":"relay.validation.invalid:30117","platform":"windows","direction":"both"}'
    secrets: inherit
  publish:
    needs: [discover, build]
    if: always() && needs.discover.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.discover.outputs.version }}
          RELEASE_UPDATED: ${{ needs.discover.outputs.release_updated }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const {compare} = require('./.github/scripts/release_selection.cjs');
            const version = process.env.VERSION;
            async function read(path, fallback) {
              try {
                const {data} = await github.rest.repos.getContent({...context.repo, path, ref: 'master'});
                return {sha: data.sha, value: JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'))};
              } catch (e) { if (e.status === 404) return {value: fallback}; throw e; }
            }
            async function save(path, item, message) {
              await github.rest.repos.createOrUpdateFileContents({...context.repo, path, branch: 'master', sha: item.sha, message, content: Buffer.from(JSON.stringify(item.value, null, 2) + '\n').toString('base64')});
            }
            const attempts = await read('rdgenerator/release_attempts.json', {});
            attempts.value[version] = {result: process.env.BUILD_RESULT, release_updated: process.env.RELEASE_UPDATED, run: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`};
            await save('rdgenerator/release_attempts.json', attempts, `Record RustDesk ${version} qualification`);
            if (process.env.BUILD_RESULT !== 'success') { core.notice('Build did not pass. Version remains hidden from the panel.'); return; }
            const registry = await read('rdgenerator/supported_versions.json', {stable: []});
            registry.value.stable = [...new Set([...registry.value.stable, version])].sort((a, b) => compare(b, a));
            await save('rdgenerator/supported_versions.json', registry, `Enable tested RustDesk ${version}`);
            // GITHUB_TOKEN commits do not trigger push workflows: deploy explicitly.
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'pages.yml', ref: 'master'});
