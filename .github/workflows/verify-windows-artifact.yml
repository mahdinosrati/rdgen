name: Verify an existing Windows artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID containing the Windows artifact'
        required: true
        type: string
      artifact_name:
        description: 'Windows artifact name'
        required: true
        type: string
      config_ref:
        description: 'Temporary branch containing encrypted expected configuration'
        required: false
        type: string
      config_json:
        description: 'Original saved configuration JSON to compare against the EXE'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install brotli
      - name: Load expected configuration
        uses: ./.github/actions/decrypt-secrets
        with:
          config_ref: ${{ inputs.config_ref }}
          private_key: ${{ secrets.RDGEN_PRIVATE_KEY }}
          config_json: ${{ inputs.config_json }}
          zip_password: ''
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: client
      - name: Verify the actual executable payload
        run: python .github/scripts/verify_windows_package.py client
      - name: Install MSI extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y msitools
      - name: Verify MSI configuration without installing it
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, tempfile
          expected = json.loads(base64.b64decode(os.environ['custom']))
          installers = list(pathlib.Path('client').glob('*.msi'))
          if not installers:
              raise ValueError('No MSI installer was published')
          reports = []
          for installer in installers:
              with tempfile.TemporaryDirectory() as folder:
                  subprocess.run(['msiextract', '-C', folder, str(installer)], check=True, capture_output=True)
                  configs = list(pathlib.Path(folder).rglob('custom_.txt'))
                  if not configs:
                      raise ValueError('MSI is missing custom_.txt')
                  for config in configs:
                      actual = json.loads(base64.b64decode(config.read_bytes(), validate=True))
                      if actual != expected:
                          raise ValueError('MSI configuration differs from the requested configuration')
                  reports.append({'filename': installer.name, 'configuration_matches': True,
                                  'sha256': hashlib.sha256(installer.read_bytes()).hexdigest()})
          pathlib.Path('client/verification-msi.json').write_text(json.dumps(reports, indent=2))
          print('Verified configuration inside every published MSI installer.')
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-verification
          path: client/verification*.json

  cleanup-encrypted-input:
    needs: verify
    if: always() && inputs.config_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          CONFIG_REF: ${{ inputs.config_ref }}
        with:
          script: |
            const ref = process.env.CONFIG_REF;
            if (!/^rdgen-inputs\/[0-9a-f-]{36}$/.test(ref)) throw new Error('Invalid input branch');
            await github.rest.git.deleteRef({...context.repo, ref: `heads/${ref}`});
